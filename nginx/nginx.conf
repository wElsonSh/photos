events {
    worker_connections 1024;
}

http {
    server {
        # Nginx слушает порт 80 внутри контейнера
        listen 80;

        # Все запросы, начинающиеся с /app, отправляем в React
        location /app {
            # react-service — это имя контейнера из шага 4
            proxy_pass http://react-service:5173;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        # Все остальные запросы (включая главную /) отправляем в Next.js
        location / {
            # next-service — это имя контейнера из шага 4
            proxy_pass http://next-service:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }
    }
}