services:
  # Контейнер 1: Next.js
  next-service:
    build: ./apps/public-app
    volumes:
      - ./apps/public-app:/app # Связываем твою папку с контейнером (чтобы работал Hot Reload)
      - /app/node_modules # Изолируем node_modules внутри контейнера

  # Контейнер 2: React
  react-service:
    build: ./apps/local-app
    volumes:
      - ./apps/local-app:/app
      - /app/node_modules

  # Контейнер 3: Nginx (Вахтер)
  nginx:
    image: nginx:alpine
    ports:
      - "3000:80" # Пробрасываем твой localhost:3000 на 80-й порт Nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - next-service
      - react-service
